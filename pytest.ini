[pytest]
# R2-T3: pytest markers for test categorization
markers =
    unit: Fast unit tests for CI (no external dependencies)
    integration: Integration tests that require full setup (KG ingest, LightRAG)
    integration_real: Integration tests against entorno real (LightRAG + Ollama), skippable si no hay precondiciones
    optional_dep: Tests that require optional dependencies and may be skipped if missing
    smoke: Quick smoke tests to validate basic functionality
    slow: Tests that take >1 second
    graph_rag: Tests specific to Graph RAG module

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    tests
    scripts
norecursedirs =
    .venv
    venv
    .git
    .pytest_cache
    htmlcov
    dist
    build
    site-packages

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
