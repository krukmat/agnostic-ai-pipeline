providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434
  openai:
    type: openai
  codex_cli:
    type: codex_cli
    command:
    - codex
    - exec
    cwd: .
    timeout: 300
    input_format: stdin_text
    output_clean: true
    extra_args:
    - -c
    - sandbox_permissions=["disk-full-access"]
    append_temperature: false
    append_max_tokens: false
  claude_cli:
    type: claude_cli
    command:
    - claude
    - -p
    - --print
    - --output-format
    - json
    cwd: .
    timeout: 600
    input_format: stdin_text
    output_clean: true
    parse_json: true
    append_system_prompt: true
    extra_args: []
    debug: true
    debug_args:
    - --verbose
    - --debug
    log_stderr: true
  vertex_cli:
    type: vertex_cli
    project_id: agnostic-pipeline-478600
    location: europe-west1
    model: gemini-2.5-flash
    temperature: 0.2
    max_output_tokens: 2048
  vertex_sdk:
    type: vertex_sdk
    project_id: agnostic-pipeline-478600
    location: europe-west1
    model: gemini-2.5-flash
    temperature: 0.2
    max_output_tokens: 2048
roles:
  ba:
    provider: ollama
    model: qwen2.5-coder:7b
    temperature: 0.3
    max_tokens: 8192
    top_p: 0.9
  architect:
    provider: ollama
    model: qwen2.5-coder:14b
    temperature: 0.2
    max_tokens: 12000
    top_p: 0.95
    output_caps:
      stories:
        tokens: 2000
        min_tokens: 600
      architecture:
        tokens: 2000
        min_tokens: 600
  dev:
    provider: ollama
    model: deepseek-coder-v2:lite
    temperature: 0.2
    max_tokens: 8192
    top_p: 0.5
    backup_models:
    - provider: ollama
      model: mistral:7b-instruct
      reason: Faster fallback for limited memory
      cost_tier: free
      specialties:
      - code_generation
      - local_execution
  qa:
    provider: ollama
    model: qwen2.5-coder:7b
    temperature: 0.4
    max_tokens: 8192
    top_p: 0.9
  product_owner:
    provider: ollama
    model: qwen2.5-coder:7b
    temperature: 0.4
    max_tokens: 8192
    top_p: 0.95
  orchestrator:
    provider: ollama
    model: qwen2.5-coder:7b
    temperature: 0.2
    max_tokens: 4096
    top_p: 0.95
pipeline:
  force_approval_attempts: 3
  max_recovery_attempts: 2
  auto_recovery_strategy: smart
  model_fallback:
    enabled: true
    auto_suggest: true
    allow_cost_increase: false
    prefer_local: true
  allow_architect_with_po_needs_adjustment: true

  # V2 Orchestrator Configuration
  use_v2_orchestrator: false
  v2_max_steps: 20
  v2_max_parallel_stories: 3

  # Retry Policies (Task 6)
  retry_policies:
    dev:
      max_attempts: 3
      backoff: exponential
      circuit_breaker:
        threshold: 5
        window: 600
    architect:
      max_attempts: 2
      backoff: linear
      escalation: manual
    qa:
      max_attempts: 2
      backoff: none
      on_failure: return_to_dev

  # Escalation Policies (Task 6)
  escalation_policies:
    - condition: "dev_attempts >= 3 AND same_error_pattern"
      action: "architect_refine"
      reason: "Repeated Dev failures suggest architectural issue"
    - condition: "qa_coverage < 0.8 AND tests_failed > 0"
      action: "architect_review_tests"
      reason: "Low coverage with failures needs design review"

  # Priority Policies (Task 6)
  priority_policies:
    - priority: P0
      max_retries: 5
      timeout_multiplier: 2.0
    - priority: P1
      max_retries: 3
      timeout_multiplier: 1.0
    - priority: P2
      max_retries: 2
      timeout_multiplier: 0.8

  # Resource Policies (Task 6)
  resource_policies:
    max_parallel_stories: 3
    max_concurrent_dev: 2
    max_concurrent_qa: 1
    dev_timeout: 600
    qa_timeout: 300
features:
  pipeline_guard:
    bypass: false
  learning_store:
    retention_per_story: 20
  policy_feedback:
    enabled: true
    failure_threshold: 2
    priority_boosts: {}
a2a:
  execution_mode: local
  agents:
    business_analyst:
      url: http://localhost:8001/
      capabilities:
        streaming: false
      skills: []
      strategy: auto
    product_owner:
      url: http://localhost:8002/
      capabilities:
        streaming: false
      skills: []
      strategy: auto
    architect:
      url: http://localhost:8003/
      capabilities:
        streaming: false
      skills: []
      strategy: auto
    developer:
      url: http://localhost:8004/
      capabilities:
        streaming: false
      skills: []
      strategy: auto
    qa:
      url: http://localhost:8005/
      capabilities:
        streaming: false
      skills: []
      strategy: auto
    orchestrator:
      url: http://localhost:8010/
      capabilities:
        streaming: false
      skills: []
      strategy: auto
  authentication:
    mode: none
features:
  use_dspy_ba: false
  use_dspy_product_owner: false
  use_dspy_architect: false
  routing_by_complexity_enabled: true
  pipeline_guard:
    bypass: false
  architect:
    arch_only: false
    normalize_minified_arch: true
    use_optimized_prompt: false
    prompt_override_file: ''
defaults:
  complexity: medium
qa:
  allow_no_tests: true
  run_tests: false
routing_by_complexity:
  dev:
    simple:
      provider: codex_cli
      model: gpt-5.1-codex-max
    medium:
      provider: codex_cli
      model: gpt-5.1-codex-max
    complex:
      provider: vertex_sdk
      model: gemini-2.5-pro
  qa:
    simple:
      provider: ollama
      model: qwen2.5-coder:32b
    medium:
      provider: vertex_cli
      model: gemini-2.5-flash
    complex:
      provider: vertex_cli
      model: gemini-2.5-pro
database:
  adhoc_context: true
  fail_on_error: false
  enabled: false
  path: data/pipeline.db
  wal_mode: true
  busy_timeout_ms: 5000
  backup_on_iteration_end: true
drivers:
  enabled: false
  embedded:
    run_build: false
    run_test: false
    run_flash: false
project:
  targets:
    backend: fastapi
    frontend: web_express
    mobile: react_native
    embedded: null
    gpu: null

# Phase 4: Complete Orchestration Configuration (Task 6)
coherence:
  enabled: true
  checkpoints:
    post_requirements: true
    post_planning: true
    post_development: false
    post_integration: true
  min_coverage: 0.95
  min_similarity: 0.75
  llm_enabled: true
  llm_for_checkpoints:
    - post_integration
  block_on_critical: true
  auto_remediate: true
  notify_on_warnings: true

cot_tracking:
  enabled: true
  layer_aware: true
  export_formats:
    - jsonl
    - markdown
  output_dir: artifacts/cot_layer6

orchestration:
  llm_fallback:
    enabled: true
    use_for:
      - escalation_planning
      - complex_decisions
    llm_role: orchestrator
    max_tokens: 2000
    temperature: 0.3

# Phase 1: Graph RAG with LightRAG (F1-T5: LLM Client Integration)
graph_rag:
  enabled: true                                # F1-T5: Enable Graph RAG context augmentation
  working_dir: "./artifacts/graph_rag"
  llm_model: "qwen2.5:7b-instruct"            # For entity extraction
  embedding_model: "bge-m3"                    # Multilingual embeddings (1024-dim)
  embedding_dim: 1024
  chunk_token_size: 1200
  top_k: 60
  default_mode: "mix"                          # Graph + vector combined (recommended)
  auto_ingest: false                           # R2-T2: Manual indexing (use 'make rag-index' post-iteration)
  sources:                                     # Directories to ingest
    - "planning/"
    - "project/"
    - "artifacts/"
    - "docs/"
  # Budget guard for context injection into LLM prompts
  context_budget_chars: 4000                  # Max chars of context to inject (prevents token overflow)
  context_truncation_strategy: "hierarchical" # Truncate by paragraph boundaries, not mid-word
  # Query caching for 3-5x latency reduction
  cache_enabled: false                        # Enable in-memory query cache (default: false)
  cache_ttl: 3600                             # Cache time-to-live in seconds (default: 1 hour)
  cache_max_size: 1000                        # Max number of cached queries (default: 1000)
  # Multi-language support for global queries
  language_detection: true                    # Enable automatic language detection
  supported_languages: ["en", "es", "fr", "de", "zh"]  # ISO 639-1 codes
  default_language: "en"                      # Fallback language for unsupported input
  # Note: Role-specific policies configured in AgentRetriever.ROLE_POLICIES
  # - architect: mode=hybrid (graph-heavy for design relationships)
  # - dev: mode=local (nearby entities for code)
  # - others: mode=mix (balanced)
